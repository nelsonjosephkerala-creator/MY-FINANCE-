<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338CA">
<title>Nelson-Finance</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dark.css">
<script>try{var s=JSON.parse(localStorage.getItem('nf:v1:settings')||'{}');document.documentElement.setAttribute('data-theme',s.theme==='dark'?'dark':'light');}catch(e){}</script>
<style>
  .welcome{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(120% 120% at 50% 0%,var(--bg),var(--surface-2))}
  .wcard{width:min(460px,94vw);text-align:center;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-xl);box-shadow:var(--sh-3);padding:36px 30px}
  .wlogo{width:74px;height:74px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;color:#fff;
    font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--brand-600),#7C3AED);box-shadow:0 16px 34px -14px rgba(79,70,229,.7)}
  .welcome h1{font-size:26px;margin-bottom:6px}
  .welcome p{color:var(--muted);margin-bottom:22px;line-height:1.6}
  .wfeat{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
  .wfeat .chip{background:var(--surface-2)}
</style>
</head>
<body>
<div class="welcome">
  <div class="wcard">
    <div class="wlogo">₣</div>
    <h1>Nelson-Finance</h1>
    <p>Your offline money manager — income, expenses, and transfers to your
       Oman and India accounts, with monthly reports you can export.</p>
    <div class="wfeat">
      <span class="chip">OMR &amp; INR</span>
      <span class="chip">Works offline</span>
      <span class="chip">PDF &amp; Excel</span>
    </div>
    <a href="dashboard.html" class="btn primary block" id="enter">Open dashboard</a>
    <p style="font-size:12px;margin:16px 0 0">All data stays on this device.</p>
  </div>
</div>
<!-- seed defaults on first visit so the dashboard is ready -->
<script src="js/storage.js"></script>
<script>DB.seed();</script>
</body>
</html>
